name: Frontend lint

on:
  push:
    branches: [main, dev, dots/browser-lifecycle-check-20261026]
  pull_request:
    branches: ["**"]

jobs:
  frontend_lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chinese screenshot fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: yarn install --frozen-lockfile --ignore-scripts
      - name: ESLint
        run: yarn lint
      - name: TypeScript check
        run: yarn typecheck
      - name: Frontend tests
        run: yarn test
      - name: Offline browser lifecycle checks (sandbox required)
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          DEBUG: "pw:browser"
        run: |
          google-chrome --version
          yarn test:browser:typecheck
          yarn test:browser
      - name: Portable packaging tests
        run: node --test .github/workflows/windows-portable/portable-archive.node-test.mjs
      - name: Staged Rust check regression tests
        run: node --test script/check-rust.node-test.mjs
      - name: Record screenshot provenance
        run: |
          node --input-type=module -e 'import fs from "node:fs"; import cp from "node:child_process"; const blob=cp.execFileSync("git",["rev-parse","HEAD:src/components/pdf_renderer.tsx"],{encoding:"utf8"}).trim(); fs.writeFileSync("test-results/provenance.json", JSON.stringify({capture_commit:process.env.GITHUB_SHA,run_url:"https://github.com/"+process.env.GITHUB_REPOSITORY+"/actions/runs/"+process.env.GITHUB_RUN_ID,scope:"Synthetic 40-page PDF in real Chromium/PDF.js fixture; not macOS/Tauri or authenticated Canvas",renderer_blob:blob},null,2));'
      - name: Upload generated PDF review screenshots
        uses: actions/upload-artifact@v4
        with:
          name: pdf-review-screenshots
          path: |
            test-results/**/*.png
            test-results/provenance.json
          if-no-files-found: error
          retention-days: 14
